# Pax volta profile for OpenAPPA (estate adaptation, 2026-10-10).
#
# Case: a dispatched Claude worker doing Rust work in this repository
# (the volta rewrite: key server, proxy, MCP/A2A surfaces).
# This profile is the second, deterministic gate under the harness's
# own permissions, modeled on the OpenAPPA pilot's image profile
# (~/openappa-pilot/profiles/image/appa.toml): the claude-code battery
# is included unchanged, and the root rules below add volta's own
# workflows, volta's secret classes, and volta's MCP tool tiers.
#
# Root rules run before the included battery's rules, and the first
# matching rule wins. Inside the Bash group the hard denies come
# before the allows on purpose: the deny selectors are substrings, so
# a denied operation inside a compound command is still blocked,
# while the allow selectors are command prefixes. Everywhere else
# the rules are alphabetical.
#
# Labels: reading a file of one of volta's secret classes narrows the
# session audience to `self` (APPA's audience for the requester's own
# secrets; the battery's `credentials` tag records why). A narrowed
# session cannot write to the staging zones declared below, and the
# network commands are hard-denied in every session.
#
# The include is relative, as the engine requires: it resolves only
# where the pinned pilot tree sits at ~/openappa-pilot, and the
# configuration fails to load anywhere else rather than running
# without the battery.

include = ["../../../../openappa-pilot/src/marketplace/batteries/claude-code/appa.toml"]

[policy]
version = 2
trust_chain = ["suspicious", "trusted"]

# --- Bash: network egress and destructive operations, hard deny ---
#
# `blocked` is the reserved attention mark no authority can permit:
# these calls have no remedy, in replay or live.

[[policy.tool]]
name = "host/claude-code/Bash(command:* gh *)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:* nc *)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*/nc *)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl *)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git -* push*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git clean*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git reset*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
