# --- Write and Edit: staging zones a narrowed session cannot reach ---
#
# Writing to a scratch or staging destination is allowed only while
# the session audience still contains `public` — that is, before the
# session has read anything labeled `self`. After a secret-class
# read, these writes are denied: labeled content does not leave the
# repo's cleared ground for a staging path, not even a lookalike
# repo directory spelled to pass as this one.

[[policy.tool]]
name = "host/claude-code/Edit(file_path:/dev/shm/*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:/home/phaedrus/workspace/repos/volta-*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:/home/phaedrus/workspace/repos/volta_*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:/tmp/*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:/var/tmp/*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:/dev/shm/*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:/home/phaedrus/workspace/repos/volta-*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
