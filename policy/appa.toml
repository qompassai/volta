# --- MCP: volta's mutating tools, ask-tier ---
#
# State-changing operations wait for the person running the session.

[[policy.tool]]
name = "mcp/volta/volta_ephemeral_issue"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "mcp/volta/volta_ephemeral_revoke"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
