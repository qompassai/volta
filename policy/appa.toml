delta = {}

[[policy.tool]]
name = "mcp/volta/volta_key_request_verify"
requires = { attention = ["hitl"] }
delta = {}

# --- MCP: decapsulation, hard deny by every plausible name ---
#
# Volta has no decapsulation tool, by design (SPEC 7.3/8.2: private
# material never leaves server custody, and no MCP tool performs or
# exposes decapsulation). APPA tool identities admit no wildcards,
# so the plausible spellings are declared and blocked here; any
# other spelling is an undeclared tool, which the covered registry
# refuses before it runs.

[[policy.tool]]
name = "mcp/volta/decapsulate"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "mcp/volta/volta_decapsulate"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "mcp/volta/volta_ephemeral_decapsulate"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "mcp/volta/volta_key_decapsulate"
requires = { attention = ["blocked"] }
delta = {}

# --- Read and Grep: volta's secret classes are `self` data ---
#
# Reading volta's key material or secret files narrows the session
# to `self`. The battery already labels the generic shapes (private
# keys by extension, credential and token filenames, the pass store);
# these are volta's named shapes. A selector matches the path as
# written, not the resolved path, as in the battery.

[[policy.tool]]
name = "host/claude-code/Read(file_path:*bootstrap-token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Read(file_path:*bootstrap_token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
