[package]
name = "volta-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Volta clean-room rewrite: HTTP key server (HKP, VKS, WKD), ephemeral keys, MCP, A2A, WebAuthn operator auth"

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
volta-core = { path = "../volta-core" }
volta-crypto = { path = "../volta-crypto" }
volta-proxy = { path = "../volta-proxy" }
webauthn-rs.workspace = true

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

[[bin]]
name = "volta"
path = "src/main.rs"
