# #################################################################
# /qompassai/volta/rewrite/docs/book/book.toml
# Qompass AI — volta book
#
# Instantiated from the dotfiles mdBook template (primo
# ~/.config/mdbook/, copied per its quickstart.sh).
# Deviations from the template, all forced by this machine:
# - [preprocessor.links] dropped: mdbook-links not installed.
# - [output.pandoc] dropped: mdbook-pandoc not installed.
# - mdbook-admonish and mdbook-d2 dropped: both target the
#   mdBook 0.4 preprocessor JSON and fail fatally under
#   primo's mdBook 0.5.4 (missing `sections` field). The
#   remaining preprocessors (footnote, graphviz, katex,
#   mermaid, pagetoc) are 0.5-compatible here.
# - The stray top-level `heading-split-level` line (an
#   unknown [build] field under 0.5) is dropped; the setting
#   lives under the search section.
# - The search section's "theme/book.cs" (template typo,
#   missing s) is corrected to "theme/book.css".
# - The template's search section carried HTML-level keys
#   that mdBook 0.5 rejects as unknown search fields; they
#   are moved to the html section where 0.5 expects them,
#   and non-mdBook keys are dropped.
# - The rust edition is "2021": primo's older preprocessor
#   binaries reject "2024" in this field.
