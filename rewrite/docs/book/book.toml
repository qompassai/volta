# Reference: https://rust-lang.github.io/mdBook/format/configuration/index.html

[book]
authors = ["Qompass AI"]
description = "Volta: an OpenPGP key server for humans and agents — verified publication, ephemeral hybrid post-quantum session keys, chained-proxy relay, passkey operators."
language = "en"
src = "src"
text-direction = "ltr"
title = "volta"


[build]
build-dir = "book"
create-missing = true
extra-watch-dirs = []
use-default-preprocessors = true

[preprocessor.footnote]
renderers = ["html"]

[preprocessor.graphviz]
renderers = ["html"]

[preprocessor.katex]
renderers = ["html"]

[preprocessor.mermaid]
renderers = ["html"]

[preprocessor.pagetoc]
renderers = ["html"]

[output.epub]
command = "mdbook-epub"

[output.html]
additional-css = ["theme/book.css"]
additional-js = ["theme/book.js"]
cname = "volta.qompass.ai"
edit-url-template = "https://github.com/qompassai/volta/edit/main/rewrite/docs/book/src/{path}"
git-repository-icon = "fab-github"
git-repository-url = "https://github.com/qompassai/volta"
input-404 = "not-found.md"
mathjax-support = false
no-section-label = false
preferred-dark-theme = "navy"
site-url = "/volta/"
smart-punctuation = true

[output.html.code]
hidelines = { python = "~" }

[output.html.fold]
enable = false
level = 0

[output.html.playground]
copyable = true
copy-js = true
editable = false
line-numbers = false
runnable = true

[output.html.print]
enable = true
page-break = true

[output.html.search]
boost-hierarchy = 2
boost-paragraph = 1
boost-title = 2
enable = true
expand = true
heading-split-level = 3
limit-results = 30
teaser-word-count = 30
use-boolean-and = true

[output.html.search.chapter]
"appendix" = { enable = false }
"appendix/glossary.md" = { enable = true }

[output.markdown]

[rust]
edition = "2021"
